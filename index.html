<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a12">
<meta name="description" content="DV SOHAN — Free websites for gamers and creators.">
<title>DV SOHAN | VIEW MY ALL THINGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --bg:#070914;--text:#f3f5ff;--muted:#a4abc4;--cyan:#35f4ff;--purple:#a855f7;--pink:#ff4bd8;--line:rgba(124,145,210,.2);
  --glow:0 0 30px rgba(53,244,255,.2),0 0 80px rgba(168,85,247,.14)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-3;pointer-events:none;background:
  radial-gradient(circle at 15% 15%,rgba(168,85,247,.22),transparent 35%),
  radial-gradient(circle at 85% 25%,rgba(53,244,255,.16),transparent 32%),
  radial-gradient(circle at 50% 100%,rgba(255,75,216,.12),transparent 38%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
a{color:inherit;text-decoration:none}button{font:inherit}

/* Header: logo only */
.top{position:sticky;top:0;z-index:50;background:rgba(7,9,20,.7);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);animation:dropIn .8s cubic-bezier(.2,.8,.2,1) both}
.top::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);background-size:200% 100%;animation:sweep 5s linear infinite;opacity:.7}
.nav{width:min(1160px,calc(100% - 32px));min-height:78px;margin-inline:auto;display:flex;align-items:center;justify-content:flex-start}
.brand{display:flex;align-items:center;gap:15px}
.brand-logo{width:54px;height:54px;object-fit:contain;border-radius:50%;border:2px solid rgba(53,244,255,.45);box-shadow:0 0 22px rgba(53,244,255,.25);animation:pulseRing 3s ease-in-out infinite}
.brand-copy{display:flex;flex-direction:column;line-height:1.15;gap:4px}
.brand-copy strong{font-size:1.4rem;font-weight:900}
.brand-copy small{font-size:.7rem;letter-spacing:3px;color:var(--cyan);font-weight:800}

/* Hero */
.hero{width:min(1160px,calc(100% - 32px));margin-inline:auto;display:flex;flex-direction:column;align-items:center;gap:40px;padding:56px 0 80px}
.heading{display:flex;align-items:center;justify-content:center;gap:24px;width:100%}
.heading h1{margin:0;font-size:clamp(1.8rem,4.5vw,2.7rem);letter-spacing:9px;font-weight:900;color:var(--cyan);text-shadow:0 0 24px rgba(53,244,255,.55);animation:fadeUp .9s .3s both}
.line{height:4px;width:0;border-radius:8px;background:linear-gradient(90deg,var(--purple),var(--cyan));box-shadow:0 0 20px var(--cyan);animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) forwards}
.line:last-child{background:linear-gradient(270deg,var(--purple),var(--cyan))}
@keyframes grow{to{width:clamp(36px,9vw,96px)}}

.stage{perspective:1100px;width:min(590px,100%);animation:rise 1.1s .45s cubic-bezier(.2,.8,.2,1) both}
.card-border{padding:3px;border-radius:46px;background:conic-gradient(from var(--a),var(--cyan),var(--purple),var(--pink),var(--cyan));animation:angle 6s linear infinite;box-shadow:0 0 40px rgba(53,244,255,.4),0 0 110px rgba(168,85,247,.28);transform-style:preserve-3d;transition:transform .15s ease-out}
.card{position:relative;overflow:hidden;min-height:760px;padding:70px 44px 46px;display:flex;flex-direction:column;align-items:center;border-radius:43px;background:radial-gradient(circle at 50% 62%,rgba(53,200,255,.22),transparent 55%),radial-gradient(circle at 90% 100%,rgba(168,85,247,.28),transparent 45%),linear-gradient(160deg,#0d2a47,#081a31 60%,#0a1428)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(53,244,255,.14) 1.5px,transparent 1.5px);background-size:22px 22px;opacity:.35}
.card>*{position:relative;z-index:1}

.ribbon{position:absolute!important;z-index:3!important;top:34px;left:-74px;width:270px;padding:10px 0;text-align:center;transform:rotate(-45deg);background:linear-gradient(120deg,#10c6e8,#3aa8ff);color:#04101c;font-size:1.5rem;font-weight:900;letter-spacing:6px;overflow:hidden;box-shadow:0 6px 20px rgba(53,244,255,.3)}
.ribbon::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 3.2s 1.2s infinite}

.pill{display:flex;align-items:center;gap:12px;padding:10px 22px;border:2px solid rgba(53,244,255,.35);border-radius:18px;background:rgba(4,16,30,.9);color:#8afcff;text-shadow:none;box-shadow:0 0 22px rgba(53,244,255,.3);font-size:1.2rem;font-weight:800;animation:fadeUp .8s .9s both}
.dot{width:10px;height:10px;border-radius:50%;background:#5bffae;box-shadow:0 0 12px #5bffae;animation:blink 1.6s infinite}
.card h2{margin:46px 0 0;font-size:clamp(2.1rem,6vw,3.2rem);line-height:1.15;text-align:center;}
.card h2 .w{display:inline-block;white-space:pre;color:#fff;font-weight:900;text-shadow:0 2px 0 rgba(0,20,40,.9),0 0 18px rgba(53,244,255,.55);opacity:0;animation:letter .7s cubic-bezier(.2,1.3,.3,1) forwards,wave 3.2s ease-in-out infinite}

.art{position:relative;width:250px;height:250px;margin:54px 0 50px;display:grid;place-items:center;animation:fadeUp .9s 1.2s both}
.art::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(53,244,255,.22),transparent 65%);animation:breathe 3.2s ease-in-out infinite}
.orbit{position:absolute;inset:0;border:2px dashed rgba(127,250,255,.8);border-radius:50%;animation:spin 22s linear infinite}
.orbit.two{inset:24px;border:3px solid rgba(200,130,255,.8);animation:spin 14s linear infinite reverse}
.orbit i{position:absolute;top:-6px;left:50%;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
.orbit.two i{background:var(--pink);box-shadow:0 0 16px var(--pink);top:auto;bottom:-6px}
.browser{position:relative;width:155px;height:132px;border:6px solid #2ec4f5;border-radius:24px;background:linear-gradient(145deg,rgba(120,240,255,.4),rgba(20,50,90,.95));box-shadow:0 0 34px rgba(53,244,255,.55);animation:float 4.5s ease-in-out infinite}
.bar{height:25px;border-bottom:4px solid #2ec4f5;display:flex;align-items:center;gap:7px;padding:0 8px;background:rgba(53,244,255,.1);border-radius:16px 16px 0 0}
.bar i{width:8px;height:8px;border-radius:50%;background:#a4b8c5}
.bar span{flex:1;height:10px;border-radius:10px;background:rgba(53,244,255,.2)}
.sk{height:29px;margin:14px 15px 0;border-radius:8px;background:linear-gradient(90deg,rgba(120,240,255,.25) 25%,rgba(200,255,255,.8) 50%,rgba(120,240,255,.25) 75%);background-size:200% 100%;animation:shimmer 1.8s linear infinite}
.sk.s{height:9px;width:56px;margin-top:12px;animation-delay:.4s}
.globe{position:absolute;right:-22px;top:-24px;font-size:3.5rem;color:var(--cyan);text-shadow:0 0 22px rgba(120,250,255,.95);animation:pulse 2.4s ease-in-out infinite}

.view{position:relative;overflow:hidden;width:100%;max-width:465px;min-height:80px;display:flex;align-items:center;justify-content:center;gap:14px;border:2px solid rgba(127,235,255,.55);border-radius:30px;color:#04101c;font-size:1.7rem;font-weight:900;letter-spacing:3px;cursor:pointer;background:linear-gradient(110deg,#22e6f5,#4d9bff,#22e6f5);background-size:200% 100%;box-shadow:0 0 30px rgba(53,244,255,.3);transition:transform .25s,box-shadow .25s;animation:fadeUp .8s 1.4s both,btnflow 4s linear infinite,glowpulse 2.8s 2.2s ease-in-out infinite}
.view::after{content:"";position:absolute;top:0;bottom:0;width:70px;left:-120px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.6s 2s infinite}
.view:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 48px rgba(53,244,255,.55)}
.view:active{transform:scale(.98)}
.view:focus-visible,.ok:focus-visible,.x:focus-visible{outline:3px solid #fff;outline-offset:3px}
.eye{font-size:2rem;line-height:1;transition:transform .4s}
.view:hover .eye{transform:scale(1.25) rotate(90deg)}
.star{position:absolute;z-index:0;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 1px rgba(120,250,255,.9);opacity:0;animation:twinkle 3s ease-in-out infinite;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}

/* Popup */
.overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:22px;background:rgba(1,4,12,.82);backdrop-filter:blur(10px);animation:fade .25s both}
.overlay[hidden]{display:none}
.overlay.out{animation:fadeOut .22s forwards}
.pop{position:relative;width:min(560px,100%);max-height:calc(100vh - 44px);max-height:calc(100dvh - 44px);display:flex;flex-direction:column;padding:26px 22px 22px 22px;border:1px solid rgba(53,244,255,.28);border-radius:34px;background:linear-gradient(160deg,rgba(8,32,48,.95),#050914 55%);box-shadow:0 0 50px rgba(53,244,255,.18),0 0 90px rgba(0,120,160,.12);animation:popIn .45s cubic-bezier(.2,1.2,.3,1) both}
.overlay.out .pop{animation:popOut .22s forwards}
.pop-head{position:relative;display:flex;align-items:center;justify-content:center;min-height:56px;margin-bottom:16px}
.pop h2{margin:0;font-family:Orbitron,Inter,sans-serif;font-weight:900;font-size:clamp(1.7rem,6vw,2.4rem);letter-spacing:3px;color:#fff}
.x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:#8b95a7;font-size:2.4rem;line-height:1;cursor:pointer;transition:transform .3s,color .2s}
.x:hover{color:#fff;transform:translateY(-50%) rotate(90deg)}
.vlist{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 10px 4px 0;scrollbar-width:thin;scrollbar-color:#1593a8 transparent}
.vlist::-webkit-scrollbar{width:5px}
.vlist::-webkit-scrollbar-thumb{background:#1593a8;border-radius:10px}
.vitem{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px;border:1px solid rgba(21,147,168,.3);border-radius:20px;background:rgba(4,24,38,.85);transition:transform .2s,border-color .2s,box-shadow .2s}
.vitem:hover{transform:translateY(-2px);border-color:rgba(53,244,255,.6);box-shadow:0 0 22px rgba(53,244,255,.15)}
.vinfo{min-width:0}
.vinfo h3{margin:0 0 2px;font-family:Orbitron,Inter,sans-serif;font-weight:700;font-size:clamp(1.15rem,4.6vw,1.6rem);color:#16e0f5;letter-spacing:1px;line-height:1.3}
.vinfo p{margin:0;color:#8b95a7;font-size:clamp(.9rem,3.4vw,1.15rem);line-height:1.35}
.vbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border:2px solid #22d3ee;border-radius:14px;background:rgba(2,16,28,.9);color:#fff;font-weight:700;font-size:clamp(1rem,3.8vw,1.35rem);letter-spacing:.5px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.vbtn:hover{background:#22d3ee;color:#04101c;box-shadow:0 0 24px rgba(53,244,255,.5);transform:translateY(-2px)}
.vbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:420px){.vitem{padding:16px 14px}.vbtn{padding:12px 18px}}

/* Keyframes */
@keyframes letter{from{opacity:0;transform:translateY(30px) scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes wave{50%{transform:translateY(-6px)}}
@keyframes breathe{50%{transform:scale(1.18);opacity:.6}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.4)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.94)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes angle{to{--a:360deg}}
@keyframes shine{to{left:130%}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes textflow{to{background-position:250% 0}}
@keyframes btnflow{to{background-position:200% 0}}
@keyframes sweep{to{background-position:-200% 0}}
@keyframes blink{50%{opacity:.35}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes pulseRing{50%{box-shadow:0 0 34px rgba(53,244,255,.5)}}
@keyframes glowpulse{50%{box-shadow:0 0 52px rgba(53,244,255,.55)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
@keyframes flip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(180deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.88)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:translateY(10px) scale(.95)}}

@media(max-width:700px){
  .nav{min-height:68px}.brand-logo{width:46px;height:46px}.brand-copy strong{font-size:1.15rem}.brand-copy small{font-size:.6rem;letter-spacing:2px}
  .hero{padding:40px 0 60px;gap:30px}.heading{gap:12px}.heading h1{letter-spacing:5px}
  .card{min-height:640px;padding:70px 22px 32px;border-radius:34px}.card-border{border-radius:37px}
  .ribbon{top:28px;left:-80px;width:250px;font-size:1.25rem}
  .pill{font-size:1rem;padding:9px 16px}.art{width:205px;height:205px;margin:44px 0 40px}.browser{transform:scale(.85)}
  .view{min-height:66px;font-size:1.35rem;border-radius:22px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.line{width:60px}#fx{display:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="top">
  <nav class="nav" aria-label="Brand">
    <a class="brand" href="#home" aria-label="DV SOHAN home">
      <img class="brand-logo" src="https://i.ibb.co.com/SXDGwtHk/file-00000000bf708211ba9ab6626f2e1e15.png" alt="DV SOHAN logo">
      <span class="brand-copy"><strong>DV SOHAN</strong><small>OFFICIAL WEBSITE</small></span>
    </a>
  </nav>
</header>

<main>
  <section class="hero" id="home">
    <div class="heading"><span class="line"></span><h1>MY WEBSITE</h1><span class="line"></span></div>

    <div class="stage" id="stage">
      <div class="card-border" id="tilt">
        <article class="card">
          <div class="ribbon">SITES</div>
          <div class="pill"><span class="dot"></span><span>100% BEST</span></div>
          <h2>MY ALL WEBSITE</h2>
          <div class="art" aria-hidden="true">
            <div class="orbit"><i></i></div>
            <div class="orbit two"><i></i></div>
            <div class="browser">
              <div class="bar"><i></i><i></i><i></i><span></span></div>
              <div class="sk"></div><div class="sk s"></div>
              <div class="globe">◎</div>
            </div>
          </div>
          <button class="view" id="viewBtn" type="button"><span>VIEW</span><span class="eye" aria-hidden="true">◎</span></button>
        </article>
      </div>
    </div>
  </section>

  <div class="overlay" id="popup" role="dialog" aria-modal="true" aria-labelledby="popTitle" hidden>
    <div class="pop">
      <div class="pop-head">
        <h2 id="popTitle">Website</h2>
        <button class="x" id="popX" type="button" aria-label="Close">×</button>
      </div>
      <div class="vlist">
        <div class="vitem">
          <div class="vinfo"><h3>TikTok Video Download</h3></div>
          <a class="vbtn" href="https://sohantok.vercel.app" target="_blank" rel="noopener noreferrer">VIEW</a>
        </div>
        <div class="vitem">
          <div class="vinfo"><h3>YT VIDEO ANALYZER</h3></div>
          <a class="vbtn" href="https://sohananalyzer.vercel.app" target="_blank" rel="noopener noreferrer">VIEW</a>
        </div>
        <div class="vitem">
          <div class="vinfo"><h3>Coming Soon</h3></div>
          <a class="vbtn" href="https://about:blank" target="_blank" rel="noopener noreferrer">VIEW</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Floating particles
  var c = document.getElementById('fx'), x = c.getContext('2d'), P = [], W, H;
  function size(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  function make(){
    P = []; var n = Math.min(36, Math.floor(W / 30));
    for (var i = 0; i < n; i++) P.push({x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+.6, vy: -(Math.random()*.4+.12), vx: (Math.random()-.5)*.25, k: Math.random() < .5 ? '53,244,255' : (Math.random() < .5 ? '168,85,247' : '255,75,216')});
  }
  function draw(){
    x.clearRect(0,0,W,H);
    P.forEach(function(p){
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10){ p.y = H + 10; p.x = Math.random()*W; }
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283);
      x.fillStyle = 'rgba(' + p.k + ',.7)'; x.fill();
    });
    requestAnimationFrame(draw);
  }
  size(); make(); addEventListener('resize', function(){ size(); make(); });
  if (!reduce) draw();

  // Letter-by-letter title + twinkling stars
  var h = document.querySelector('.card h2'), t = h.textContent; h.setAttribute('aria-label', t); h.textContent = '';
  t.split('').forEach(function(ch, i){
    var w = document.createElement('span'); w.className = 'w'; w.setAttribute('aria-hidden', 'true'); w.textContent = ch;
    w.style.animationDelay = (1.05 + i*.07) + 's,' + (2.4 + i*.12) + 's'; h.appendChild(w);
  });
  var card = document.querySelector('.card');
  for (var i = 0; i < 8; i++){
    var st = document.createElement('i'); st.className = 'star';
    st.style.left = (Math.random()*94 + 3) + '%'; st.style.top = (Math.random()*94 + 3) + '%';
    st.style.animationDelay = (Math.random()*3) + 's'; st.style.animationDuration = (2.2 + Math.random()*2.5) + 's';
    card.appendChild(st);
  }

  // 3D tilt on the card (mouse only)
  var stage = document.getElementById('stage'), tilt = document.getElementById('tilt');
  if (!reduce && matchMedia('(hover:hover)').matches){
    stage.addEventListener('pointermove', function(e){
      var r = stage.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
      tilt.style.transform = 'rotateY(' + (px*9) + 'deg) rotateX(' + (-py*9) + 'deg)';
    });
    stage.addEventListener('pointerleave', function(){ tilt.style.transform = ''; });
  }

  // Button ripple + popup
  var btn = document.getElementById('viewBtn'), pop = document.getElementById('popup'),
      cl = document.getElementById('popX');
  btn.addEventListener('click', function(e){
    var r = btn.getBoundingClientRect(), s = document.createElement('span'), d = 60;
    s.className = 'ripple'; s.style.width = s.style.height = d + 'px';
    s.style.left = (e.clientX - r.left - d/2) + 'px'; s.style.top = (e.clientY - r.top - d/2) + 'px';
    btn.appendChild(s); setTimeout(function(){ s.remove(); }, 650);
    pop.classList.remove('out'); pop.hidden = false; cl.focus();
  });
  function close(){
    pop.classList.add('out');
    setTimeout(function(){ pop.hidden = true; pop.classList.remove('out'); btn.focus(); }, reduce ? 0 : 220);
  }
  cl.addEventListener('click', close);
  pop.addEventListener('click', function(e){ if (e.target === pop) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !pop.hidden) close(); });
})();
</script>
</body>
</html>
